[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Release profile — required for deployment (brings bytecode within the EVM 24,576-byte limit).
# Uses separate output and cache directories so release artifacts never overwrite test-profile
# artifacts and the two sets of evidence remain independently reproducible.
# Build command: FOUNDRY_PROFILE=release forge build --skip test --skip script
# Deployment artifact: contracts/release-out/BusinessKernel.sol/BusinessKernel.json
# Release favors deployment size; measured results live in docs/evidence/release-artifact-verification.json
[profile.release]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/release-out"
libs = ["lib"]
cache_path = "contracts/release-cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
